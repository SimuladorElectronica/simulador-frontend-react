name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: simulador-canva

jobs:
  checks:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simulador-canva/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build
